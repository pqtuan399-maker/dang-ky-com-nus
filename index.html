<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Đăng ký cơm NUS</title>

  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <meta name="apple-mobile-web-app-title" content="Đăng ký cơm NUS">
  <meta name="application-name" content="Đăng ký cơm NUS">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0F766E">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f7f6;
      font-family: Arial, sans-serif;
      color: #173b35;
      text-align: center;
    }

    .card {
      width: min(90%, 420px);
      padding: 36px 24px;
      background: white;
      border-radius: 28px;
      box-shadow: 0 14px 45px rgba(0,0,0,.10);
    }

    .icon {
      width: 140px;
      height: 140px;
      border-radius: 30px;
      object-fit: cover;
    }

    h1 {
      margin: 22px 0 8px;
      font-size: 26px;
    }

    p {
      margin: 0 0 28px;
      color: #66736f;
      line-height: 1.5;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px;
      background: #0F766E;
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 14px;
    }
  </style>
</head>

<body>
  <main class="card">
    <img class="icon" src="icon.png" alt="Đăng ký cơm NUS">

    <h1>ĐĂNG KÝ CƠM NUS</h1>

    <p>
      Hệ thống đăng ký cơm<br>
      NUS 2026 - 2027
    </p>

    <a
      class="button"
      href="https://docs.google.com/spreadsheets/d/1YjmqfspA-z4t9EUj3T-1Q9Of86M6SQ-_jcnupS_a6D4/edit?gid=596498506#gid=596498506"
    >
      MỞ ĐĂNG KÝ CƠM
    </a>
  </main>
</body>
</html>
